name: libevent pre-PR matrix

on:
  push:
    branches: [feat/add-libevent]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: tar.gz
          - os: macos-15
            suffix: macosx-arm64
            ext: tar.gz
          - os: windows-2022
            suffix: windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mcpp 2026.10.1.2
        shell: bash
        run: |
          version=2026.10.1.2
          archive="mcpp-${version}-${{ matrix.suffix }}.${{ matrix.ext }}"
          curl -L -fsS -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${version}/${archive}"
          case "$archive" in
            *.zip) powershell -NoProfile -Command "Expand-Archive -Force -Path '${archive}' -DestinationPath '.'" ;;
            *) tar -xzf "$archive" ;;
          esac
          root="$PWD/mcpp-${version}-${{ matrix.suffix }}"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "MCPP=$(cygpath -m "$root/bin/mcpp.exe")" >> "$GITHUB_ENV"
            echo "MCPP_VENDORED_XLINGS=$(cygpath -m "$root/registry/bin/xlings.exe")" >> "$GITHUB_ENV"
          else
            echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
            echo "MCPP_VENDORED_XLINGS=$root/registry/bin/xlings" >> "$GITHUB_ENV"
          fi
      - name: Exercise libevent
        shell: bash
        env:
          MCPP_INDEX_MIRROR: GLOBAL
        run: |
          "$MCPP" --version
          "$MCPP" xpkg parse --all-os pkgs/c/compat.libevent.lua
          "$MCPP" index update
          "$MCPP" test -p libevent --cache off
